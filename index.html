<!DOCTYPE html>

<head>

<body>
  <div id="landing-stage">
    <header id="gallery-header">
      <img class="hero-image" src="src/about/header.jpg" alt="Painting of a person holding a cup of tea">
      <canvas class="hero-eye-overlay" aria-hidden="true"></canvas>
      <div class="header-brand">
        <h1 aria-label="Bedoworks"><span>BEDO</span><span>WORKS</span></h1>
        <a class="header-link instagram-link" href="https://www.instagram.com/yourmomspilledpaintintheattic" target="_blank" rel="noopener noreferrer" aria-label="Bedoworks on Instagram">

            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>

    </header>
    <main id="gallery"></main>
  </div>
  <footer class="copyright">
    Copyright &copy; 2026 Bedoworks. All rights reserved.
  </footer>

  <section id="viewer" hidden>
    <a id="viewer-home" class="viewer-brand home-link" href="./" aria-label="Bedoworks home">
      <h1 aria-label="Bedoworks"><span>BEDO</span><span>WORKS</span></h1>

    <a id="close" href="#" aria-label="Close">&times;</a>
    <button id="prev" aria-label="Previous">&larr;</button>

      <figcaption class="placard">
        <div id="title"></div>
        <div id="subtitle"></div>
        <div id="year"></div>

      <img id="art" alt="">
    </figure>
    <button id="next" aria-label="Next">&rarr;</button>
    <footer class="copyright">
      Copyright &copy; 2026 Bedoworks. All rights reserved.
    </footer>
  </section>

    <script type="module" src="app.js?v=20261012-46"></script>
