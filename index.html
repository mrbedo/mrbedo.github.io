<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bedo Works Of Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Bedo Works Of Art</h1></header>
  <main id="gallery"></main>
  <footer class="copyright">
    &copy; 2026 Bedo Works Of Art. All rights reserved. <a href="LICENSE">License</a>
  </footer>

  <section id="viewer" hidden>
    <a id="close" href="#" aria-label="Close">&times;</a>
    <button id="prev" aria-label="Previous">&larr;</button>
    <figure>
      <figcaption class="placard">
        <h2 id="title"></h2>
        <p id="dimensions"></p>
        <div id="description"></div>
      </figcaption>
      <img id="art" alt="">
    </figure>
    <button id="next" aria-label="Next">&rarr;</button>
    <footer class="copyright">
      &copy; 2026 bedo. All rights reserved. <a href="LICENSE">License</a>
    </footer>
  </section>

  <script src="app.js"></script>
</body>
</html>
