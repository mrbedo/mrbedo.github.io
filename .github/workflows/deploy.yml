name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check core coverage
        run: npm run test:core-coverage

      - name: Build site
        run: npm run build

      - name: Stamp build version
        id: build-version
        run: |
          export BUILD_VERSION="$(date -u '+%Y.%m.%d.%H%M%S')"
          echo "version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const version = process.env.BUILD_VERSION;
          if (!/^\d{4}\.\d{2}\.\d{2}\.\d{6}$/.test(version ?? '')) {
            throw new Error('BUILD_VERSION must use YYYY.MM.DD.HHMMSS format');
          }
          const path = 'dist/index.html';
          const html = readFileSync(path, 'utf8');
          if (html.split('</head>').length !== 2) {
            throw new Error('Built index.html must contain exactly one closing head tag');
          }
          writeFileSync(path, html.replace('</head>', `<meta name="build-version" content="${version}">\n</head>`));
          NODE

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Tag deployed release
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$BUILD_VERSION" -m "Release $BUILD_VERSION"
          git push origin "refs/tags/$BUILD_VERSION"
